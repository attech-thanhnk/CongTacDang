events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 50M;

    upstream auth_backend {
        server auth-service:5000;
    }

    upstream core_backend {
        server core-api:5000;
    }

    upstream export_backend {
        server export-service:5000;
    }

    upstream web_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Giao diện người dùng Next.js
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Dịch vụ Xác thực & Hồ sơ cán bộ 2 vai
        location /api/auth/ {
            proxy_pass http://auth_backend/api/User/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Dịch vụ Xuất Báo cáo Excel/PDF (ClosedXML - RAM Giới hạn 1GB)
        location /api/export/ {
            proxy_pass http://export_backend/api/ExportReport/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
        }

        # 4. Nghiệp vụ cốt lõi (Mẫu 01, 02, Bỏ phiếu 11, Thẩm định, Upload)
        location /api/ {
            proxy_pass http://core_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
