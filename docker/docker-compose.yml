services:
  # Cơ sở dữ liệu quan hệ PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: attech-dangbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-congtacdang_db}
      POSTGRES_USER: ${POSTGRES_USER:-dangbo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AttechDang2026!Secret}
    ports:
      - "${POSTGRES_PORT:-5434}:5432" # Cổng ngoài 5434 tránh xung đột với PostgreSQL cục bộ
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dangbo_admin} -d ${POSTGRES_DB:-congtacdang_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dangbo-net

  # Kho lưu trữ đối tượng MinIO (Cổng 9000: S3 API, Cổng 9001: Web Console)
  minio:
    image: quay.io/minio/minio:latest
    container_name: attech-dangbo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - dangbo-net

  # Khởi tạo sẵn bucket 'congtacdang-files' và cấp quyền tải cho MinIO
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: attech-dangbo-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb localminio/congtacdang-files --ignore-existing;
      /usr/bin/mc anonymous set download localminio/congtacdang-files;
      exit 0;
      "
    networks:
      - dangbo-net

  # Backend Web API .NET 10 (Kết nối PostgreSQL và MinIO)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: attech-dangbo-api
    restart: unless-stopped
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=congtacdang_db;Username=dangbo_admin;Password=AttechDang2026!Secret
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=congtacdang_db;Username=dangbo_admin;Password=AttechDang2026!Secret
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Storage__Provider=minio # minio (Môi trường Production) hoặc local (Lưu cục bộ)
      - Storage__Minio__Endpoint=minio:9000
      - Storage__Minio__BucketName=congtacdang-files
      - Storage__Minio__AccessKey=minioadmin
      - Storage__Minio__SecretKey=minioadmin
      - Storage__Minio__UseSsl=false
      - Storage__Minio__PublicEndpoint=localhost:9000
    ports:
      - "5000:5000"
    volumes:
      - backend-storage:/app/storage # Lưu trữ bền vững chống mất file khi chạy chế độ local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dangbo-net

  # Giao diện người dùng Web Next.js 14
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: attech-dangbo-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - dangbo-net

  # Giao diện quản trị CSDL pgAdmin 4 (admin@attech.com.vn / AttechAdmin2026!)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attech-dangbo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@attech.com.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AttechAdmin2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dangbo-net

volumes:
  postgres-data:
    name: attech-dangbo-postgres-data
  backend-storage:
    name: attech-dangbo-backend-storage
  minio-data:
    name: attech-dangbo-minio-data
  pgadmin-data:
    name: attech-dangbo-pgadmin-data

networks:
  dangbo-net:
    name: attech-dangbo-network
    driver: bridge
