services:
  # Cơ sở dữ liệu quan hệ PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: attech-dangbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-congtacdang_db}
      POSTGRES_USER: ${POSTGRES_USER:-dangbo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD phải được đặt trong docker/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dangbo-net

  # Backend Web API .NET 10. Backend chỉ expose trong mạng Docker mặc định.
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: attech-dangbo-api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-congtacdang_db};Username=${POSTGRES_USER:-dangbo_admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD phải được đặt trong docker/.env}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      Storage__Local__Path: /app/uploads
      Logging__File__Path: /var/log/congtacdang
      Logging__File__RetainedDays: ${LOG_RETAINED_DAYS:-30}
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownProxies__0: 127.0.0.1
      Database__AutoMigrate: ${Database__AutoMigrate:-true}
      Database__SeedSampleData: ${Database__SeedSampleData:-false}
      Seed__SamplePassword: ${Seed__SamplePassword:-}
      Seed__InitialAdmin__Username: ${Seed__InitialAdmin__Username:-}
      Seed__InitialAdmin__FullName: ${Seed__InitialAdmin__FullName:-}
      Seed__InitialAdmin__Password: ${Seed__InitialAdmin__Password:-}
      Security__Password__MinLength: ${Security__Password__MinLength:-8}
      Security__RateLimit__Auth__PermitLimit: ${Security__RateLimit__Auth__PermitLimit:-10}
      Security__RateLimit__Auth__WindowSeconds: ${Security__RateLimit__Auth__WindowSeconds:-60}
      Organization__ApprovalAuthorityRefreshMinutes: ${Organization__ApprovalAuthorityRefreshMinutes:-60}
      Notifications__DueSoonDays: ${Notifications__DueSoonDays:-2}
    expose:
      - "5000"
    ports: ${BACKEND_PORTS:-[]}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/var/log/congtacdang
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dangbo-net

  # Giao diện người dùng Web Next.js 14
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Proxy /api/* được ghi cố định lúc build; đổi địa chỉ backend phải build lại image.
        BACKEND_INTERNAL_URL: http://backend:5000
    container_name: attech-dangbo-web
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dangbo-net

  # Giao diện quản trị CSDL, chỉ bật khi cần công cụ vận hành.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attech-dangbo-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD phải được đặt trong docker/.env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dangbo-net

volumes:
  postgres-data:
    name: attech-dangbo-postgres-data
  backend-uploads:
    name: attech-dangbo-backend-uploads
  backend-logs:
    name: attech-dangbo-backend-logs
  pgadmin-data:
    name: attech-dangbo-pgadmin-data

networks:
  dangbo-net:
    name: attech-dangbo-network
    driver: bridge
