# =============================================================================
# KIẾN TRÚC MODULAR CONTAINERIZED SERVICES - ĐẢNG BỘ ATTECH (03-HD/TVĐU)
# Tách riêng: Export (RAM limit 1GB) + Auth/User + Core API + Nginx Gateway
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL 16 Alpine duy nhất
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: attech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: congtacdang_db
      POSTGRES_USER: attech_admin
      POSTGRES_PASSWORD: AttechDang2026!Secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attech_admin -d congtacdang_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attech-net

  # ---------------------------------------------------------------------------
  # 2. User & Auth Service (.NET 10) - Quản trị 68 cán bộ 2 vai, JWT, RBAC
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: attech-auth-service
    restart: unless-stopped
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attech-net

  # ---------------------------------------------------------------------------
  # 3. Core Business API (.NET 10) - Mẫu 01, Mẫu 02, Bỏ phiếu 11, Thẩm định, Upload
  # ---------------------------------------------------------------------------
  core-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: attech-core-api
    restart: unless-stopped
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - attachments-data:/app/storage/attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attech-net

  # ---------------------------------------------------------------------------
  # 4. Export Service (.NET 10 / ClosedXML) - Giới hạn 1GB RAM chống treo hệ thống
  # ---------------------------------------------------------------------------
  export-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: attech-export-service
    restart: unless-stopped
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=congtacdang_db;Username=attech_admin;Password=AttechDang2026!Secret
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attech-net

  # ---------------------------------------------------------------------------
  # 5. Web Frontend Next.js 14
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: attech-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - attech-net

  # ---------------------------------------------------------------------------
  # 6. Nginx Reverse Proxy / API Gateway - Cổng vào duy nhất cổng 80
  # ---------------------------------------------------------------------------
  nginx-gateway:
    image: nginx:alpine
    container_name: attech-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - core-api
      - export-service
      - auth-service
    networks:
      - attech-net

volumes:
  postgres-data:
    name: attech-modular-postgres-data
  attachments-data:
    name: attech-modular-attachments-data

networks:
  attech-net:
    name: attech-modular-network
    driver: bridge
