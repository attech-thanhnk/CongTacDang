name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL riêng của CI cho test tích hợp (không kết nối tới máy chủ dùng chung trong LAN).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctd_ci
          POSTGRES_PASSWORD: ctd_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctd_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chuỗi kết nối tới CSDL quản trị của service trên; test tự tạo/xóa CSDL ctd_it_*.
      CONGTACDANG_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=ctd_ci;Password=ctd_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/CongTacDang.slnx
      - name: Build
        run: dotnet build backend/CongTacDang.slnx --no-restore --configuration Release
      - name: Test (unit + integration)
        run: dotnet test backend/CongTacDang.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --file docker/Dockerfile.backend --tag congtacdang-backend:ci .
      - name: Build frontend image
        run: docker build --file docker/Dockerfile.frontend --tag congtacdang-frontend:ci .
